version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: onboarding_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'secretpassword'
      MYSQL_DATABASE: 'packages'

    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
